<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--oroC:#b8860b;--oroO:#e8c874;--tinta:#4a3b22}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#c9b389;padding:10px;font-family:Georgia,serif}
.banner-arb{position:relative;width:100%;max-width:440px;margin:0 auto;border-radius:16px;overflow:hidden;
 box-shadow:0 0 0 2px var(--oroO),0 0 0 4px var(--oroC),0 6px 16px rgba(20,30,25,.32)}
.banner-arb img.main{width:100%;display:block}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nodo{position:absolute;transform:translate(-50%,-50%);text-align:center}
.nodo .lauro{position:relative;width:30px;height:32px;margin:0 auto;filter:drop-shadow(0 2px 3px rgba(40,25,5,.5))}
.nodo .lauro img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%}
.nodo .foto{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e6d09a,#c9a24b);
 color:#7a5410;font-weight:700;font-size:8px;box-shadow:0 0 0 1px var(--oroO)}
.nodo .nm{font-size:8px;font-weight:700;color:#3a2c12;margin-top:0;line-height:1;white-space:nowrap;
 text-shadow:0 1px 2px rgba(255,250,235,.95),0 0 3px rgba(255,250,235,.85)}
.sim{position:absolute;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.sim.novios{font-size:8px;letter-spacing:-1px}
.inset{position:absolute;bottom:2%;width:24%}
.inset img{width:100%;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));
 -webkit-mask:radial-gradient(120% 108% at 50% 46%,#000 48%,rgba(0,0,0,0) 80%);mask:radial-gradient(120% 108% at 50% 46%,#000 48%,rgba(0,0,0,0) 80%)}
.inset .ico{position:absolute;right:6%;bottom:16%;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.inset .cap{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-size:8px;font-weight:700;color:#3a2c12;
 text-shadow:0 1px 2px rgba(255,250,235,.95)}
.leyenda{max-width:440px;margin:8px auto 0;text-align:center;font-size:12px;color:#3a2c12;line-height:1.7}
.leyenda b{color:#5a4310}
</style></head><body>
<div class="banner-arb">
  <img class="main" src="arboles/olivo.png">
  <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">
    <g stroke="#6b4f2a" stroke-width="0.5" fill="none" opacity="0.85">
      <path d="M50 18 V27 M13 27 H87"/>
      <path d="M13 27 V32 M87 27 V32 M37 27 V36 M69 27 V36"/>
      <!-- hijos de Pili: Leon y Abril(baja con su novio) -->
      <path d="M37 44 V50 M28 50 H40 M28 50 V54 M40 50 V60"/>
      <!-- hijos de Fernando: Anita y Sandra -->
      <path d="M69 44 V50 M64 50 H76 M64 50 V54 M76 50 V54"/>
    </g>
  </svg>

  <!-- abuelos: casados -->
  <span class="sim" style="left:50%;top:14%">❤️</span>
  <div class="nodo" style="left:43%;top:14%"><div class="lauro"><img src="../corona.png"><div class="foto">E</div></div><div class="nm">Estrella</div></div>
  <div class="nodo" style="left:57%;top:14%"><div class="lauro"><img src="../corona.png"><div class="foto">P</div></div><div class="nm">Pepe</div></div>

  <!-- hijos solteros (fila subida) -->
  <div class="nodo" style="left:13%;top:32%"><div class="lauro"><img src="../corona.png"><div class="foto">J</div></div><div class="nm">José</div></div>
  <div class="nodo" style="left:87%;top:32%"><div class="lauro"><img src="../corona.png"><div class="foto">L</div></div><div class="nm">Luis</div></div>

  <!-- Pili: expareja Ivan (izq) + nueva pareja Marcos (der) -->
  <span class="sim" style="left:31%;top:39%">💔</span>
  <span class="sim" style="left:43%;top:39%">💗</span>
  <div class="nodo" style="left:25%;top:39%"><div class="lauro"><img src="../corona.png"><div class="foto">I</div></div><div class="nm">Iván</div></div>
  <div class="nodo" style="left:37%;top:39%"><div class="lauro"><img src="../corona.png"><div class="foto">P</div></div><div class="nm">Pili</div></div>
  <div class="nodo" style="left:49%;top:39%"><div class="lauro"><img src="../corona.png"><div class="foto">M</div></div><div class="nm">Marcos</div></div>

  <!-- Fernando + Ana: casados -->
  <span class="sim" style="left:69%;top:39%">❤️</span>
  <div class="nodo" style="left:63%;top:39%"><div class="lauro"><img src="../corona.png"><div class="foto">F</div></div><div class="nm">Fernando</div></div>
  <div class="nodo" style="left:75%;top:39%"><div class="lauro"><img src="../corona.png"><div class="foto">A</div></div><div class="nm">Ana</div></div>

  <!-- nietos: Leon (soltero) y Abril (baja con su novio) -->
  <div class="nodo" style="left:28%;top:55%"><div class="lauro"><img src="../corona.png"><div class="foto">L</div></div><div class="nm">León</div></div>
  <span class="sim novios" style="left:45%;top:63%">❤️<span style="color:#ff5fa2">💗</span></span>
  <div class="nodo" style="left:39%;top:63%"><div class="lauro"><img src="../corona.png"><div class="foto">A</div></div><div class="nm">Abril</div></div>
  <div class="nodo" style="left:51%;top:63%"><div class="lauro"><img src="../corona.png"><div class="foto">N</div></div><div class="nm">Novio</div></div>

  <!-- nietos de Fernando -->
  <div class="nodo" style="left:64%;top:55%"><div class="lauro"><img src="../corona.png"><div class="foto">A</div></div><div class="nm">Anita</div></div>
  <div class="nodo" style="left:76%;top:55%"><div class="lauro"><img src="../corona.png"><div class="foto">S</div></div><div class="nm">Sandra</div></div>

  <!-- insets: amigos (izq) y mascotas (der) -->
  <div class="inset" style="left:1%"><img src="arboles/olivo.png"><div class="ico">🧑‍🤝‍🧑</div><div class="cap">Amigos</div></div>
  <div class="inset" style="right:1%"><img src="arboles/olivo.png"><div class="ico">🐾</div><div class="cap">Mascotas</div></div>
</div>
<div class="leyenda">
  ❤️ <b>Casados</b> &nbsp;·&nbsp; 💗 <b>Pareja</b> &nbsp;·&nbsp; ❤️💗 <b>Novios</b> &nbsp;·&nbsp; 💔 <b>Expareja</b><br>
  Izquierda: <b>árbol de amigos</b> &nbsp;·&nbsp; Derecha: <b>mascotas</b>
</div>
</body></html>
